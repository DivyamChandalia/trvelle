[project]
name = "trvelle"
version = "0.1.0"
description = "Durable travel planning API with model routing, verified search evidence, and editable itineraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "eralchemy>=1.5.0",
    "fastapi>=0.115.12",
    "google-search-results>=2.4.2",
    "gradio>=5.32.0",
    "graphviz>=0.20.3",
    "human-id>=0.2.0",
    "langchain-google-genai>=4",
    "langchain-mcp-adapters>=0.2",
    "langchain-tavily>=0.2",
    "langgraph>=1",
    "mcp[cli]>=1.9.1",
    "psycopg2-binary>=2.9.10",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.41",
]
