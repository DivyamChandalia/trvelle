    <circle cx="765" cy="154" r="18" fill="#f6f9ff"/>
    <circle cx="888" cy="154" r="18" fill="#f6f9ff"/>
    <circle cx="1010" cy="154" r="18" fill="#f6f9ff"/>
    <path d="M758 154l5 5 9-10M881 154l5 5 9-10M1003 154l5 5 9-10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#526b88">
    <text x="765" y="201">Research</text><text x="888" y="201">Plan</text><text x="1010" y="201">Refine</text>
  </g>
