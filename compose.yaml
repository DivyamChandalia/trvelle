services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trvelle
      POSTGRES_USER: trvelle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - trvelle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trvelle -d trvelle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trvelle_postgres:
